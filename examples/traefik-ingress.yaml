apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snaggle
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: snaggle.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snaggle-service
                port:
                  number: 8000
