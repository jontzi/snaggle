apiVersion: apps/v1
kind: Deployment
metadata:
  name: snaggle
  labels:
    app: snaggle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snaggle
  template:
    metadata:
      labels:
        app: snaggle
    spec:
      containers:
        - name: snaggle
          image: snaggle:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MAX_DOWNLOAD_SECONDS
              value: "900"
            - name: MAX_FILE_SIZE
              value: "2000M"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: snaggle-service
  labels:
    app: snaggle
spec:
  type: NodePort
  selector:
    app: snaggle
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30002
